<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0" r="1.3">
      <stop offset="0" stop-color="#1a2418"/>
      <stop offset="0.7" stop-color="#0a0a0c"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title -->
  <g transform="translate(80, 0)">
    <text x="0" y="190" font-family="Instrument Serif, Georgia, serif" font-size="110" font-weight="400" fill="#a6e36f" letter-spacing="-3">MixLab</text>
    <text x="0" y="232" font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="400" fill="#8886a0">v0.1 · Drink Innovation System</text>

    <text x="0" y="320" font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="400" fill="#e8e6f0">Explore ingredient combinations and instantly see</text>
    <text x="0" y="362" font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="400" fill="#e8e6f0">their nutrition, active compounds, and safety flags.</text>

    <!-- chips -->
    <g transform="translate(0, 420)" font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600">
      <rect x="0"   y="0" width="138" height="42" rx="21" fill="#131318" stroke="#2a2a38"/>
      <text x="22" y="28" fill="#a6e36f">Nutrition</text>
      <rect x="154" y="0" width="158" height="42" rx="21" fill="#131318" stroke="#2a2a38"/>
      <text x="176" y="28" fill="#a6e36f">Compounds</text>
      <rect x="328" y="0" width="104" height="42" rx="21" fill="#131318" stroke="#2a2a38"/>
      <text x="350" y="28" fill="#a6e36f">Safety</text>
    </g>

    <text x="0" y="555" font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#8886a0">mixlab.sankhacooray.com</text>
  </g>

  <!-- right: flask -->
  <g transform="translate(990, 315)">
    <path d="M -110 80 L -70 -20 L 70 -20 L 110 80 Q 110 140 50 140 L -50 140 Q -110 140 -110 80 Z" fill="#a6e36f" opacity="0.35"/>
    <circle cx="-36" cy="40" r="9" fill="#a6e36f"/>
    <circle cx="28" cy="68" r="6" fill="#a6e36f"/>
    <circle cx="0" cy="20" r="7" fill="#a6e36f"/>
    <g stroke="#a6e36f" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-54" y1="-200" x2="54" y2="-200"/>
      <path d="M -32 -200 L -32 -100 L -110 80 Q -110 140 -50 140 L 50 140 Q 110 140 110 80 L 32 -100 L 32 -200"/>
      <line x1="-44" y1="-160" x2="44" y2="-160" stroke-width="7" opacity="0.5"/>
    </g>
