<style>
:root {
  /* Light (lab bench) is the default; dark follows the system or the switch. */
  --bg: #f5f6f0;
  --surface: #ffffff;
  --surface2: #f0f2ea;
  --surface3: #e6e9de;
  --border: #dfe3d4;
  --text: #1b1d16;
  --text-dim: #555a4a;
  --text-muted: #80856f;
  --accent: #4e8a1c;
  --accent-dim: #3f7215;
  --accent-hi: #5c9c26;
  --accent-soft: rgba(78,138,28,0.12);
  --on-accent: #ffffff;
  --danger: #c43c3c;
  --danger-bg: rgba(196,60,60,0.07);
  --danger-border: rgba(196,60,60,0.22);
  --warn: #b36b00;
  --warn-bg: rgba(179,107,0,0.07);
  --warn-border: rgba(179,107,0,0.22);
  --good: #1f8a66;
  --good-bg: rgba(31,138,102,0.07);
  --good-border: rgba(31,138,102,0.22);
  --info: #2f6fc0;
  --card-hover: #eef2e4;
  --float: rgba(255,255,255,0.86);
  --float-shadow: 0 10px 30px -14px rgba(40,50,20,.28);
  --glass-stroke: rgba(30,40,20,0.28);
  --glass-fill: rgba(30,40,20,0.04);
  --glass-label: rgba(30,40,20,0.55);
  --page-bg: #f5f6f0;
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0c; --surface: #131318; --surface2: #1a1a22; --surface3: #22222e; --border: #2a2a38;
  --text: #e8e6f0; --text-dim: #8886a0; --text-muted: #5a587a;
  --accent: #a6e36f; --accent-dim: #7ab84a; --accent-hi: #b9ef88; --accent-soft: rgba(166,227,111,0.14); --on-accent: #0a0a0c;
  --danger: #ff6b6b; --danger-bg: rgba(255,107,107,0.08); --danger-border: rgba(255,107,107,0.2);
  --warn: #ffb347; --warn-bg: rgba(255,179,71,0.08); --warn-border: rgba(255,179,71,0.2);
  --good: #6bdfb8; --good-bg: rgba(107,223,184,0.08); --good-border: rgba(107,223,184,0.2);
  --info: #7eb8ff; --card-hover: #1c1c26; --float: rgba(19,19,24,0.82); --float-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --glass-stroke: rgba(255,255,255,0.18); --glass-fill: rgba(255,255,255,0.06); --glass-label: rgba(255,255,255,0.5);
  --page-bg: #0a0a0c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0a0a0c; --surface: #131318; --surface2: #1a1a22; --surface3: #22222e; --border: #2a2a38;
  --text: #e8e6f0; --text-dim: #8886a0; --text-muted: #5a587a;
  --accent: #a6e36f; --accent-dim: #7ab84a; --accent-hi: #b9ef88; --accent-soft: rgba(166,227,111,0.14); --on-accent: #0a0a0c;
  --danger: #ff6b6b; --danger-bg: rgba(255,107,107,0.08); --danger-border: rgba(255,107,107,0.2);
  --warn: #ffb347; --warn-bg: rgba(255,179,71,0.08); --warn-border: rgba(255,179,71,0.2);
  --good: #6bdfb8; --good-bg: rgba(107,223,184,0.08); --good-border: rgba(107,223,184,0.2);
  --info: #7eb8ff; --card-hover: #1c1c26; --float: rgba(19,19,24,0.82); --float-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --glass-stroke: rgba(255,255,255,0.18); --glass-fill: rgba(255,255,255,0.06); --glass-label: rgba(255,255,255,0.5);
  --page-bg: #0a0a0c; color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* rules 14, 33, 36: nothing scrolls, no bounce */
html { height: 100%; overflow: hidden; background: var(--page-bg); overscroll-behavior: none; }
body { height: 100%; overflow: hidden; overscroll-behavior: none; display: flex; flex-direction: column;
  font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--text);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* app bar: brand · search · theme · one CTA */
.topbar { flex: none; padding-top: env(safe-area-inset-top); position: relative; z-index: 30; }
.bar-in { display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 18px; }
.logo { font-family: 'Instrument Serif', serif; font-size: 28px; color: var(--accent); letter-spacing: -.5px; white-space: nowrap; line-height: 1; }
.search { position: relative; flex: 1; max-width: 460px; margin: 0 auto; display: flex; align-items: center; }
.search svg { position: absolute; left: 13px; color: var(--text-muted); pointer-events: none; }
.search input { width: 100%; height: 40px; border: 0; border-radius: 999px; padding: 0 16px 0 38px; font: inherit; font-size: 14px; color: var(--text); background: var(--surface2); outline: none; }
.search input:focus { box-shadow: 0 0 0 2px var(--accent); background: var(--surface); }
.iconbtn { all: unset; cursor: pointer; flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: var(--text-dim); transition: background-color .15s, color .15s; }
.iconbtn:hover { color: var(--text); background: var(--accent-soft); }
.iconbtn:focus-visible, .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico-sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ico-sun { display: block; } :root:not([data-theme="light"]) .ico-moon { display: none; } }
:root[data-theme="dark"] .ico-sun { display: block; } :root[data-theme="dark"] .ico-moon { display: none; }
.cta { flex: none; cursor: pointer; border: 0; font-size: 14px; font-weight: 600; line-height: 1; background: var(--accent); color: var(--on-accent);
  padding: 11px 18px; border-radius: 999px; white-space: nowrap; transition: background-color .15s, box-shadow .15s; }
.cta:hover { background: var(--accent-hi); box-shadow: 0 0 0 4px var(--accent-soft); }
.cta .short { display: none; }
.search-open { display: none !important; }

/* two panes: your drink (the answer) and the ingredient picker */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 14px; padding: 4px 18px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; min-height: 0; position: relative; }

/* ---------- left pane ---------- */
.drinkside { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 16px 14px; }
.types { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface2); }
.types button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--text-dim); }
.types button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.verdict { height: 52px; flex: none; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.verdict .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.verdict .nm { font-family: 'Instrument Serif', serif; font-size: 26px; line-height: 1.1; color: var(--accent); }
.verdict.idle .nm { color: var(--text-muted); font-size: 22px; }
.clear-btn { position: absolute; top: 60px; right: 12px; }   /* beside the answer, clear of the type pills */
.glass-container { flex: none; width: 150px; height: 200px; display: grid; place-items: center; }
.glass-container svg { width: 100%; height: 100%; }
.glass-container .glass-outline { stroke: var(--glass-stroke); }
.glass-container .glass-label, .glass-container .glass-empty { fill: var(--glass-label); }
.glass-container .glass-straw { fill: var(--glass-fill); stroke: var(--glass-stroke); }

.d-views { flex: 1; min-height: 0; width: 100%; overflow: hidden; display: flex; flex-direction: column; }
.dv { display: none; width: 100%; flex-direction: column; gap: 6px; }
.dv.on { display: flex; }
.dv .off { display: none !important; }
.d-tabs { flex: none; display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--surface2); }
.d-tabs button { all: unset; cursor: pointer; padding: 7px 13px; border-radius: 999px; font-size: 13px; color: var(--text-dim); transition: background-color .15s, color .15s; }
.d-tabs button:hover { color: var(--text); }
.d-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.d-tabs button .badge { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin-left: 5px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--warn-bg); color: var(--warn); }
.d-empty { color: var(--text-muted); font-size: 13.5px; text-align: center; padding-top: 10px; }
.lpager { display: flex; justify-content: center; gap: 7px; min-height: 9px; margin-top: 2px; }
.lpager button { all: unset; cursor: pointer; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.lpager button.on { background: var(--accent); }

/* mix rows */
.mrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 26px; align-items: center; gap: 8px; min-height: 34px; padding: 2px 8px; border-radius: 10px; background: var(--surface2); }
.mrow .em { font-size: 18px; text-align: center; }
.mrow .nm { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.qty { display: flex; align-items: center; gap: 3px; }
.qty button, .mrow .x { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: var(--surface); }
.qty button:hover, .mrow .x:hover { background: var(--card-hover); }
.qty .v { min-width: 48px; text-align: center; font-size: 12px; color: var(--text-dim); line-height: 1.15; }
.mrow .x { background: transparent; color: var(--text-muted); font-size: 13px; }

/* nutrition */
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.macro { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; background: var(--surface2); }
.macro b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.macro span { font-size: 11px; color: var(--text-muted); }
.macro.hi { background: var(--warn-bg); }
.bar-row > span:first-child { overflow-wrap: anywhere; line-height: 1.2; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px 36px; align-items: center; gap: 8px; min-height: 22px; font-size: 12.5px; }
.bar-row .v { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); text-align: right; white-space: nowrap; }
.bar-row .pct { font-size: 11.5px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.bar-row .pct.good { color: var(--good); }
.bar { height: 6px; border-radius: 3px; background: var(--surface3); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
.bar-row.cmp { grid-template-columns: minmax(0, 1fr) auto 90px; }
.sub-lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }

/* health */
.alert { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.35; }
.alert svg { width: 16px; height: 16px; margin-top: 1px; }
.alert b { display: block; font-size: 13px; }
.alert .src { color: var(--text-muted); font-size: 11.5px; }
.alert.good { background: var(--good-bg); } .alert.good svg { color: var(--good); }
.alert.warn { background: var(--warn-bg); } .alert.warn svg { color: var(--warn); }
.alert.danger { background: var(--danger-bg); } .alert.danger svg { color: var(--danger); }
.benefits { display: flex; flex-wrap: wrap; gap: 5px; }
.benefit { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); }
.d-foot { font-size: 11.5px; color: var(--text-muted); text-align: center; }

/* ---------- right pane: ingredient picker ---------- */
.picker { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { all: unset; cursor: pointer; height: 30px; padding: 0 13px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 13px; color: var(--text-dim); background: var(--surface2); white-space: nowrap; transition: background-color .15s, color .15s; }
.pill:hover { color: var(--text); }
.pill.on { color: var(--text); background: var(--accent-soft); font-weight: 600; }
.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-auto-rows: 64px; gap: 8px; align-content: start; overflow: hidden; }
.tile { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 10px; padding: 0 10px 0 12px; border-radius: 12px; background: var(--surface2); transition: background-color .15s; }
.tile:hover { background: var(--card-hover); }
.tile.in { background: var(--accent-soft); }
.tile.off { display: none; }
.tile .em { font-size: 22px; text-align: center; }
.tile .nm { font-size: 14px; font-weight: 600; line-height: 1.2; }
.tile .meta { display: block; font-size: 11.5px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }
.tile .add { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--accent); background: var(--surface); }
.tile .add:hover { background: var(--accent); color: var(--on-accent); }
.tile .n { font-size: 11px; font-weight: 700; color: var(--accent); }
.pager { display: flex; justify-content: center; gap: 8px; min-height: 10px; }
.pager button { all: unset; cursor: pointer; width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.pager button.on { background: var(--accent); }
.p-empty { grid-column: 1 / -1; color: var(--text-muted); font-size: 13.5px; padding: 8px 2px; }

/* reserve the shared footer's final height so nothing jumps when its script arrives */
#scn-footer { flex: none; min-height: 56px; }

/* short laptop screens: a smaller glass */
@media (min-width: 900px) and (max-height: 760px) {
  .glass-container { width: 120px; height: 160px; }
  .drinkside { gap: 6px; }
  .mrow { min-height: 30px; }
  .macros { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .macro { padding: 5px 1px; } .macro b { font-size: 13px; }
}

/* ---------- narrow screens: drink pane on top in two columns, picker below ---------- */
@media (max-width: 899px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 0 10px; }
  .bar-in { padding: 0 12px; gap: 8px; }
  .search { display: none; }
  .search-open { display: grid !important; margin-left: auto; }
  .topbar.searching .search { display: flex; position: absolute; left: 10px; right: 10px; top: calc(11px + env(safe-area-inset-top)); max-width: none; z-index: 40; }
  .drinkside.card { display: grid; grid-template-columns: minmax(0, 1fr) var(--glasscol, 120px);
    grid-template-areas: "types types" "verdict glass" "views glass" "tabs tabs"; grid-template-rows: auto auto minmax(0, 1fr) auto;
    column-gap: 10px; row-gap: 6px; padding: 10px 12px 12px; align-items: start; }
  .types { grid-area: types; justify-self: start; }
  .verdict { grid-area: verdict; text-align: left; height: auto; }
  .glass-container { grid-area: glass; align-self: center; width: var(--glasscol, 120px); height: calc(var(--glasscol, 120px) * 1.33); }
  .d-views { grid-area: views; height: min(210px, 28vh); }
  .d-tabs { grid-area: tabs; justify-self: stretch; }
  .d-tabs button { flex: 1; text-align: center; padding: 6px 2px; font-size: 12px; }
  .clear-btn { top: 8px; right: 8px; }
  .types { margin-right: 36px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 54px; gap: 7px; }
  .tile { grid-template-columns: 24px minmax(0, 1fr) 28px; gap: 8px; padding: 0 8px; }
  .tile .em { font-size: 18px; } .tile .nm { font-size: 13px; } .tile .meta { display: none; }
  .pills { gap: 5px; } .pill { height: 26px; padding: 0 10px; font-size: 12px; }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto 36px 30px; gap: 6px; font-size: 12px; }
  .bar-row.cmp { grid-template-columns: minmax(0, 1fr) auto 44px; }
  .types { max-width: none; }
  .picker { gap: 8px; padding: 10px; }
}
@media (max-width: 560px) { #scn-footer { min-height: 52px; } }
@media (max-width: 520px) {
  .cta .long { display: none; } .cta .short { display: inline; }
  .cta { padding: 10px 13px; font-size: 13px; }
  .logo { font-size: 24px; }
  .types button { padding: 4px 8px; font-size: 11.5px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar-in">
    <div class="logo">MixLab</div>
    <div class="search" id="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search ingredients" autocomplete="off" aria-label="Search ingredients">
    </div>
    <button class="iconbtn search-open" id="searchOpen" type="button" aria-label="Search" title="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"><svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
    <button class="cta" id="sampleBtn" type="button"><span class="long">Mix a sample drink</span><span class="short">Sample</span></button>
  </div>
</header>

<main class="main">
  <!-- your drink: the answer -->

  if (q) items = items.filter(i => (i.name + ' ' + i.cat + ' ' + i.benefits.join(' ')).toLowerCase().includes(q));
  $('tiles').innerHTML = items.length ? items.map(i => {
    const m = mix.find(x => x.id === i.id);
    return `<div class="tile${m ? ' in' : ''}" title="${i.name} · ${i.serving}"><span class="em">${i.emoji}</span>
      <span class="nm">${i.name}<span class="meta">${i.macros.cal} kcal · ${i.serving.split('(')[0].trim()}${m ? ` · <span class="n">×${m.qty}</span>` : ''}</span></span>
      <button class="add" data-add="${i.id}" aria-label="Add ${i.name}">+</button></div>`;
  }).join('') : `<div class="p-empty">No ingredients match “${q.replace(/</g, '&lt;')}”</div>`;
  paginate();
}
$('tiles').onclick = e => { const b = e.target.closest('[data-add]'); if (b) addToMix(b.dataset.add); };
$('q').addEventListener('input', () => { ui.page = 0; renderIngredients(); });

/* split a grid's items into pages that fit its box; data-stretch grows rows to fill */
function fitPages(root, pager, key) {
  const items = [...root.children].filter(x => x.classList.contains('tile'));
  items.forEach(t => t.classList.remove('off'));
  pager.innerHTML = '';
  if (root.dataset.stretch) root.style.gridAutoRows = '';
  if (!items.length || !root.offsetParent) return;
  const cs = getComputedStyle(root), cols = cs.gridTemplateColumns.split(' ').length;
  const rowH = items[0].getBoundingClientRect().height, gap = parseFloat(cs.rowGap) || 0;
  const rows = Math.max(1, Math.floor((root.clientHeight + gap) / (rowH + gap)));
  const per = cols * rows, pages = Math.ceil(items.length / per);
  ui[key] = Math.min(ui[key], pages - 1);
  items.forEach((t, i) => t.classList.toggle('off', Math.floor(i / per) !== ui[key]));
  if (root.dataset.stretch) {
    const used = pages > 1 ? rows : Math.ceil(items.length / cols);
    root.style.gridAutoRows = Math.floor(Math.min(+root.dataset.stretch, (root.clientHeight - gap * (used - 1)) / used)) + 'px';
  }
  if (pages > 1) pager.innerHTML = Array.from({ length: pages }, (_, i) => `<button class="${i === ui[key] ? 'on' : ''}" data-page="${i}" aria-label="Page ${i + 1}"></button>`).join('');
}
const paginate = () => fitPages($('tiles'), $('pager'), 'page');
$('pager').onclick = e => { const b = e.target.closest('[data-page]'); if (b) { ui.page = +b.dataset.page; paginate(); } };
function turnPage(d) { const n = $('pager').children.length || 1, p = ui.page + d; if (p >= 0 && p < n) { ui.page = p; paginate(); } }
let wheelLock = 0;
$('tiles').addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaY) < 20 || Date.now() < wheelLock) return; wheelLock = Date.now() + 500; turnPage(e.deltaY > 0 ? 1 : -1); }, { passive: false });
new ResizeObserver(() => paginate()).observe($('tiles'));

function removeFromMix(id) { mix = mix.filter(m => m.id !== id); update(); }
function adjustQty(id, delta) { const m = mix.find(x => x.id === id); if (!m) return; m.qty = Math.max(0.25, Math.round((m.qty + delta) * 4) / 4); update(); }

      ${mac(t.macros.fat.toFixed(1), 'g', 'fat')}${mac(t.macros.fiber.toFixed(1), 'g', 'fiber')}${mac(t.macros.sugar.toFixed(1), 'g', 'sugar', t.macros.sugar > 30)}</div>
    ${micros.length ? `<div class="sub-lbl">Micronutrients · % daily value</div><div class="plist">${micros.map(k => { const val = t.micros[k], pct = Math.min(100, val / (a.MICRO_RDA[k] || 1) * 100);
      return `<div class="bar-row"><span>${a.MICRO_NAMES[k] || k}</span><span class="v">${val < 1 ? val.toFixed(2) : val.toFixed(1)} ${a.MICRO_UNITS[k] || ''}</span><span class="bar"><i style="width:${pct}%;${pct > 80 ? 'background:var(--good)' : pct > 40 ? '' : 'background:var(--text-muted)'}"></i></span><span class="pct${pct > 80 ? ' good' : ''}">${Math.round(pct)}%</span></div>`; }).join('')}</div>` : ''}`;
  // Compounds: strongest first, bar relative to the largest
  const comps = Object.keys(t.compounds).filter(k => t.compounds[k] > 0.01).sort((x, y) => t.compounds[y] - t.compounds[x]).slice(0, 16);
  const max = Math.max(1e-9, ...comps.map(k => t.compounds[k]));
  const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' g' : v >= 1 ? v.toFixed(1) + ' mg' : (v * 1000).toFixed(0) + ' µg';
  $('compView').innerHTML = comps.length ? `<div class="plist">${comps.map(k => `<div class="bar-row cmp"><span>${a.COMPOUND_NAMES[k] || k}</span><span class="v">${fmt(t.compounds[k])}</span><span class="bar"><i style="width:${t.compounds[k] / max * 100}%"></i></span></div>`).join('')}</div>`
    : empty('No notable compounds');
  // Health: cautions first, then synergies and condition notes; benefits as chips
  const cards = [];
  a.allWarnings.forEach(w => cards.push([w.type === 'danger' ? 'danger' : 'warn', w.cond, w.note, `from ${w.source}`]));
  a.activeInteractions.filter(x => x.type !== 'good').forEach(x => cards.push(['warn', x.title, x.msg]));
  a.diseaseAlerts.forEach(d => d.flags.forEach(f => cards.push(['warn', d.condition, f])));
  a.activeInteractions.filter(x => x.type === 'good').forEach(x => cards.push(['good', x.title, x.msg]));
  a.diseaseAlerts.forEach(d => d.positives.forEach(p => cards.push(['good', d.condition, p])));
  const cautions = cards.filter(c => c[0] !== 'good').length;
  $('healthView').innerHTML = `<div class="plist">${cards.map(([k, ti, msg, src]) => `<div class="alert ${k}">${ICON[k]}<div><b>${ti}</b>${msg}${src ? `<div class="src">${src}</div>` : ''}</div></div>`).join('')
      || '<div class="alert good">' + ICON.good + '<div><b>No cautions</b>Nothing flagged for this mix</div></div>'}</div>
    ${a.allBenefits.size ? `<div class="benefits">${[...a.allBenefits].map(b => `<span class="benefit">${b}</span>`).join('')}</div>` : ''}
    <div class="d-foot">Estimates · not medical advice</div>`;
  $('dtabs').querySelector('[data-dv="health"]').innerHTML = `Health${cautions ? `<span class="badge">${cautions}</span>` : ''}`;
  fitDrinkView();
}

/* page the current tab's list instead of letting it overflow (rule 36) */
function fitDrinkView() {
  const box = $('dviews'), dv = box.querySelector('.dv.on');
  if (!dv || !box.offsetParent) return;
  dv.querySelectorAll('.off').forEach(x => x.classList.remove('off'));
  dv.querySelectorAll('.lpager').forEach(x => x.remove());
  const over = () => dv.offsetHeight - box.clientHeight;
  if (over() <= 1) return;
  const benefits = dv.querySelector('.benefits');                 // health: drop the chips before paging cards
  if (benefits) { benefits.classList.add('off'); if (over() <= 1) return; }
  const list = dv.querySelector('.plist'); if (!list) return;
  const items = [...list.children]; if (items.length < 2) return;
  const pager = document.createElement('div'); pager.className = 'lpager'; pager.innerHTML = '<button></button>'; list.after(pager);
  const top = items[0].getBoundingClientRect().top, span = items.at(-1).getBoundingClientRect().bottom - top;
  const avail = Math.max(items[0].offsetHeight, span - over());
  const pages = []; let start = 0;
  items.forEach((it, i) => { if (it.getBoundingClientRect().bottom - items[start].getBoundingClientRect().top > avail && i > start) { pages.push([start, i]); start = i; } });
  pages.push([start, items.length]);
  const key = dv.dataset.dv; ui.lp[key] = Math.min(ui.lp[key] || 0, pages.length - 1);
  const [a, b] = pages[ui.lp[key]];
  items.forEach((it, i) => it.classList.toggle('off', i < a || i >= b));
  pager.innerHTML = pages.map((_, i) => `<button class="${i === ui.lp[key] ? 'on' : ''}" data-lp="${i}" aria-label="Page ${i + 1}"></button>`).join('');
  pager.onclick = e => { const x = e.target.closest('[data-lp]'); if (x) { ui.lp[key] = +x.dataset.lp; fitDrinkView(); } };
}
new ResizeObserver(() => fitDrinkView()).observe($('dviews'));

function setDrinkView(v) {
  ui.view = v;
  $('dtabs').querySelectorAll('[data-dv]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.dv === v)));
  $('dviews').querySelectorAll('.dv').forEach(el => el.classList.toggle('on', el.dataset.dv === v));

}
$('dtabs').onclick = e => { const b = e.target.closest('[data-dv]'); if (b) setDrinkView(b.dataset.dv); };

$('q').addEventListener('blur', () => { if (!$('q').value) document.querySelector('.topbar').classList.remove('searching'); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); document.querySelector('.topbar').classList.add('searching'); $('q').focus(); return; }
  if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; $('q').blur(); document.querySelector('.topbar').classList.remove('searching'); ui.page = 0; return renderIngredients(); }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); turnPage(1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); turnPage(-1); }
});

// ====================== GLASS VISUALIZATION ======================
function renderGlass() {
  const container = document.getElementById('glassContainer');
  if(mix.length === 0) {
    container.innerHTML = `<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="40%" stop-color="rgba(255,255,255,0.02)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
        </linearGradient>
      </defs>
      <path class="glass-outline" d="M45,40 L35,280 Q35,300 55,300 L145,300 Q165,300 165,280 L155,40 Z"
        fill="url(#glassShine)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <text x="100" y="180" text-anchor="middle" fill="rgba(255,255,255,0.1)" font-size="40" opacity="0.35">🥤</text>
    </svg>`;
    return;
  }

  // Calculate blended color
  let totalG = 0;
  mix.forEach(m => { const ing = getIng(m.id); totalG += ing.g * m.qty; });

  let r=0, g=0, b=0;
  mix.forEach(m => {
    const ing = getIng(m.id);
    const weight = (ing.g * m.qty) / totalG;
    const c = hexToRgb(ing.color);
    r += c.r * weight;
    g += c.g * weight;
    b += c.b * weight;
  });
  const blendedColor = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
  const lighterColor = `rgb(${Math.min(255,Math.round(r*1.3))},${Math.min(255,Math.round(g*1.3))},${Math.min(255,Math.round(b*1.3))})`;
  const darkerColor = `rgb(${Math.round(r*0.6)},${Math.round(g*0.6)},${Math.round(b*0.6)})`;

  // Fill level based on total grams (max around 600g)
  const fillPct = Math.min(0.9, totalG / 600);
  const fillTop = 280 - fillPct * 240;

  // Calculate glass width at fill top
  const leftAtTop = 45 + (35 - 45) * ((fillTop - 40) / (280 - 40)); // actually let me recalc
  const lTop = 45 + (35-45) * (280-40 - (280-fillTop)) / (280-40);
  const rTop = 155 + (165-155) * (280-40 - (280-fillTop)) / (280-40);
  const lT = 45 - (45-35) * ((fillTop-40)/(280-40));
  const rT = 155 + (165-155) * ((fillTop-40)/(280-40));

  // Build layers for visual interest
  const layers = mix.map(m => {
    const ing = getIng(m.id);
    return { color: ing.color, weight: (ing.g * m.qty) / totalG, name: ing.name };
  });

  container.innerHTML = `<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="drinkGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lighterColor}"/>
        <stop offset="60%" stop-color="${blendedColor}"/>
        <stop offset="100%" stop-color="${darkerColor}"/>
      </linearGradient>
      <linearGradient id="glassShine2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
        <stop offset="30%" stop-color="rgba(255,255,255,0.02)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.07)"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="glassClip">
        <path d="M45,40 L35,280 Q35,300 55,300 L145,300 Q165,300 165,280 L155,40 Z"/>
      </clipPath>
    </defs>

    <!-- Liquid -->
    <g clip-path="url(#glassClip)">
      <rect x="20" y="${fillTop}" width="170" height="${300-fillTop}" fill="url(#drinkGrad)"/>
      <!-- Texture dots -->
      ${mix.map((m,i) => {
        const ing = getIng(m.id);
        let dots = '';
        const count = Math.min(8, Math.ceil(m.qty * 3));
        for(let d=0; d<count; d++) {
          const cx = 55 + Math.random()*90;
          const cy = fillTop + 10 + Math.random()*(280-fillTop-20);
          const cr = 2 + Math.random()*4;
          dots += `<circle cx="${cx}" cy="${cy}" r="${cr}" fill="${ing.color}" opacity="0.35"/>`;
        }
        return dots;
      }).join('')}
      <!-- Surface foam/froth line -->
      <ellipse cx="100" cy="${fillTop}" rx="60" ry="6" fill="${lighterColor}" opacity="0.5"/>
      <!-- Bubbles -->
      ${[...Array(6)].map((_,i) => {
        const cx = 60+Math.random()*80;
        const cy = fillTop+20+Math.random()*(250-fillTop);
        return `<circle cx="${cx}" cy="${cy}" r="${1+Math.random()*2}" fill="rgba(255,255,255,0.15)">
          <animate attributeName="cy" from="${cy}" to="${fillTop}" dur="${2+Math.random()*3}s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="0.15" to="0" dur="${2+Math.random()*3}s" repeatCount="indefinite"/>
        </circle>`;
      }).join('')}
    </g>

    <!-- Glass outline -->
    <path class="glass-outline" d="M45,40 L35,280 Q35,300 55,300 L145,300 Q165,300 165,280 L155,40 Z"
      fill="url(#glassShine2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- Straw -->
    <rect class="glass-straw" x="118" y="10" width="6" height="${Math.max(fillTop,60)+20}" rx="3"
      fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>

    <!-- Volume label -->
    <text class="glass-label" x="100" y="${Math.max(30, fillTop-12)}" text-anchor="middle"
      font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">
      ${Math.round(totalG)}${totalG > 200 ? 'ml' : 'g'}
    </text>
  </svg>`;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

// ====================== ANALYSIS (totals, interactions, condition checks) ======================
function analyze() {
  // Compute totals
  const totals = { macros:{cal:0,protein:0,fat:0,carb:0,fiber:0,sugar:0}, micros:{}, compounds:{} };
  const allBenefits = new Set();
  const allWarnings = [];

  mix.forEach(m => {
    const ing = getIng(m.id);
    const q = m.qty;
    // Macros
    Object.keys(ing.macros).forEach(k => totals.macros[k] += ing.macros[k] * q);
    // Micros
    Object.keys(ing.micros).forEach(k => {
      totals.micros[k] = (totals.micros[k]||0) + ing.micros[k] * q;
    });
    // Compounds
    Object.keys(ing.compounds).forEach(k => {
      totals.compounds[k] = (totals.compounds[k]||0) + ing.compounds[k] * q;
    });
    // Benefits
    ing.benefits.forEach(b => allBenefits.add(b));
    // Warnings
    ing.warnings.forEach(w => allWarnings.push({...w, source: ing.name}));
  });

  // Check interactions
  const activeInteractions = [];
  const compoundKeys = Object.keys(totals.compounds).filter(k => totals.compounds[k] > 0);
  INTERACTIONS.forEach(inter => {
    if(inter.check) {
      const enriched = mix.map(m => ({...getIng(m.id), qty: m.qty}));
      if(inter.check(enriched)) activeInteractions.push(inter);
    } else {
      const allPresent = inter.compounds.every(c => compoundKeys.includes(c));
      if(allPresent) activeInteractions.push(inter);
    }
  });

  // Disease checks
  const diseaseAlerts = [];
  DISEASE_CHECKS.forEach(dc => {
    const flags = dc.check(totals);
    const positives = dc.positives(totals);
    if(flags.length || positives.length) {
      diseaseAlerts.push({condition: dc.condition, flags, positives});
    }
  });

  // Compound display names
  const COMPOUND_NAMES = {
    curcumin:'Curcumin', piperine:'Piperine', caffeine:'Caffeine', lTheanine:'L-Theanine',
    egcg:'EGCG', anthocyanins:'Anthocyanins', pterostilbene:'Pterostilbene', quercetin:'Quercetin',
    chlorogenicAcid:'Chlorogenic Acid', gingerol:'Gingerol', cinnamaldehyde:'Cinnamaldehyde',
    bromelain:'Bromelain', phycocyanin:'Phycocyanin', betaGlucan:'Beta-Glucan',
    lauricAcid:'Lauric Acid', oleicAcid:'Oleic Acid', betaSitosterol:'Beta-Sitosterol',
    lutein:'Lutein', glutathione:'Glutathione', dopamine:'Dopamine', serotonin:'Serotonin',
    tryptophan:'Tryptophan', resistantStarch:'Resistant Starch', mangiferin:'Mangiferin',
    betaCarotene:'Beta-Carotene', ellagicAcid:'Ellagic Acid', pelargonidin:'Pelargonidin',
    fisetin:'Fisetin', coumarin:'Coumarin', eugenol:'Eugenol', proanthocyanidins:'Proanthocyanidins',
    chlorophyll:'Chlorophyll', catechins:'Catechins', ala:'ALA (Omega-3)', lignans:'Lignans',
    betaCaryophyllene:'Beta-Caryophyllene', avenanthramides:'Avenanthramides',
    lactoferrin:'Lactoferrin', bcaa:'BCAAs', leucine:'Leucine', hydroxyproline:'Hydroxyproline',
    glycine:'Glycine', proline:'Proline', shogaol:'Shogaol', zingerone:'Zingerone',
    ferulic:'Ferulic Acid', mct:'MCTs', capricAcid:'Capric Acid', resveratrol:'Resveratrol',
    pCoumaricAcid:'p-Coumaric Acid', coq10:'CoQ10', gla:'GLA', trigonelline:'Trigonelline',
    kahweol:'Kahweol', chrysin:'Chrysin', pinocembrin:'Pinocembrin',
