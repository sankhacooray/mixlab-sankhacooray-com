<style>
:root {
  /* Light (lab bench) is the default; dark follows the system or the switch. */
  --bg: #f5f6f0;
  --surface: #ffffff;
  --surface2: #f0f2ea;
  --surface3: #e6e9de;
  --border: #dfe3d4;
  --text: #1b1d16;
  --text-dim: #555a4a;
  --text-muted: #80856f;
  --accent: #4e8a1c;
  --accent-dim: #3f7215;
  --accent-hi: #5c9c26;
  --accent-soft: rgba(78,138,28,0.12);
  --on-accent: #ffffff;
  --danger: #c43c3c;
  --danger-bg: rgba(196,60,60,0.07);
  --danger-border: rgba(196,60,60,0.22);
  --warn: #b36b00;
  --warn-bg: rgba(179,107,0,0.07);
  --warn-border: rgba(179,107,0,0.22);
  --good: #1f8a66;
  --good-bg: rgba(31,138,102,0.07);
  --good-border: rgba(31,138,102,0.22);
  --info: #2f6fc0;
  --card-hover: #eef2e4;
  --float: rgba(255,255,255,0.86);
  --float-shadow: 0 10px 30px -14px rgba(40,50,20,.28);
  --glass-stroke: rgba(30,40,20,0.28);
  --glass-fill: rgba(30,40,20,0.04);
  --glass-label: rgba(30,40,20,0.55);
  --straw: #e2574c; --bowl-a: #d9d3c4; --bowl-b: #f7f3ea; --bowl-c: #cfc7b4; --bowl-in: #ece6d8;
  --page-bg: #f5f6f0;
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0c; --surface: #131318; --surface2: #1a1a22; --surface3: #22222e; --border: #2a2a38;
  --text: #e8e6f0; --text-dim: #8886a0; --text-muted: #5a587a;
  --accent: #a6e36f; --accent-dim: #7ab84a; --accent-hi: #b9ef88; --accent-soft: rgba(166,227,111,0.14); --on-accent: #0a0a0c;
  --danger: #ff6b6b; --danger-bg: rgba(255,107,107,0.08); --danger-border: rgba(255,107,107,0.2);
  --warn: #ffb347; --warn-bg: rgba(255,179,71,0.08); --warn-border: rgba(255,179,71,0.2);
  --good: #6bdfb8; --good-bg: rgba(107,223,184,0.08); --good-border: rgba(107,223,184,0.2);
  --info: #7eb8ff; --card-hover: #1c1c26; --float: rgba(19,19,24,0.82); --float-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --glass-stroke: rgba(255,255,255,0.18); --glass-fill: rgba(255,255,255,0.06); --glass-label: rgba(255,255,255,0.5);
  --page-bg: #0a0a0c; --straw: #e8665a; --bowl-a: #3a3a44; --bowl-b: #5a5a66; --bowl-c: #2c2c34; --bowl-in: #44444f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0a0a0c; --surface: #131318; --surface2: #1a1a22; --surface3: #22222e; --border: #2a2a38;
  --text: #e8e6f0; --text-dim: #8886a0; --text-muted: #5a587a;
  --accent: #a6e36f; --accent-dim: #7ab84a; --accent-hi: #b9ef88; --accent-soft: rgba(166,227,111,0.14); --on-accent: #0a0a0c;
  --danger: #ff6b6b; --danger-bg: rgba(255,107,107,0.08); --danger-border: rgba(255,107,107,0.2);
  --warn: #ffb347; --warn-bg: rgba(255,179,71,0.08); --warn-border: rgba(255,179,71,0.2);
  --good: #6bdfb8; --good-bg: rgba(107,223,184,0.08); --good-border: rgba(107,223,184,0.2);
  --info: #7eb8ff; --card-hover: #1c1c26; --float: rgba(19,19,24,0.82); --float-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --glass-stroke: rgba(255,255,255,0.18); --glass-fill: rgba(255,255,255,0.06); --glass-label: rgba(255,255,255,0.5);
  --page-bg: #0a0a0c; --straw: #e8665a; --bowl-a: #3a3a44; --bowl-b: #5a5a66; --bowl-c: #2c2c34; --bowl-in: #44444f; color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* rules 14, 33, 36: nothing scrolls, no bounce */
html { height: 100%; overflow: hidden; background: var(--page-bg); overscroll-behavior: none; }
body { height: 100%; overflow: hidden; overscroll-behavior: none; display: flex; flex-direction: column;
  font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--text);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* app bar: brand · search · theme · one CTA */
.topbar { flex: none; padding-top: env(safe-area-inset-top); position: relative; z-index: 30; }
.bar-in { display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 18px; }
.logo { font-family: 'Instrument Serif', serif; font-size: 28px; color: var(--accent); letter-spacing: -.5px; white-space: nowrap; line-height: 1; }
.search { position: relative; flex: 1; max-width: 460px; margin: 0 auto; display: flex; align-items: center; }
.search svg { position: absolute; left: 13px; color: var(--text-muted); pointer-events: none; }
.search input { width: 100%; height: 40px; border: 0; border-radius: 999px; padding: 0 16px 0 38px; font: inherit; font-size: 14px; color: var(--text); background: var(--surface2); outline: none; }
.search input:focus { box-shadow: 0 0 0 2px var(--accent); background: var(--surface); }
.iconbtn { all: unset; cursor: pointer; flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: var(--text-dim); transition: background-color .15s, color .15s; }
.iconbtn:hover { color: var(--text); background: var(--accent-soft); }
.iconbtn:focus-visible, .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico-sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ico-sun { display: block; } :root:not([data-theme="light"]) .ico-moon { display: none; } }
:root[data-theme="dark"] .ico-sun { display: block; } :root[data-theme="dark"] .ico-moon { display: none; }
.cta { flex: none; cursor: pointer; border: 0; font-size: 14px; font-weight: 600; line-height: 1; background: var(--accent); color: var(--on-accent);
  padding: 11px 18px; border-radius: 999px; white-space: nowrap; transition: background-color .15s, box-shadow .15s; }
.cta:hover { background: var(--accent-hi); box-shadow: 0 0 0 4px var(--accent-soft); }
.cta .short { display: none; }
.search-open { display: none !important; }

/* two panes: your drink (the answer) and the ingredient picker */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 14px; padding: 4px 18px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; min-height: 0; position: relative; }

/* ---------- left pane ---------- */
.drinkside { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 16px 14px; }
.types { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface2); }
.types button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--text-dim); }
.types button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.verdict { height: 52px; flex: none; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.verdict .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.verdict .nm { font-family: 'Instrument Serif', serif; font-size: 26px; line-height: 1.1; color: var(--accent); }
.verdict.idle .nm { color: var(--text-muted); font-size: 22px; }
.clear-btn { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 20px; height: 20px; margin-left: 6px; vertical-align: -5px; border-radius: 50%; color: var(--text-dim); background: var(--surface2); }
.clear-btn:hover { color: var(--text); background: var(--accent-soft); }
.glass-container { flex: none; width: 170px; height: 221px; display: grid; place-items: center; }
.glass-container svg { width: 100%; height: 100%; }
.glass-container .glass-outline { stroke: var(--glass-stroke); }
.glass-container .glass-label, .glass-container .glass-empty { fill: var(--glass-label); }
.glass-container .glass-straw { fill: var(--glass-fill); stroke: var(--glass-stroke); }

.d-views { flex: 1; min-height: 0; width: 100%; overflow: hidden; display: flex; flex-direction: column; }
.dv { display: none; width: 100%; flex-direction: column; gap: 6px; }
.dv.on { display: flex; }
.dv .off { display: none !important; }
.d-tabs { flex: none; display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--surface2); }
.d-tabs button { all: unset; cursor: pointer; white-space: nowrap; padding: 7px 10px; border-radius: 999px; font-size: 13px; color: var(--text-dim); transition: background-color .15s, color .15s; }
.d-tabs button:hover { color: var(--text); }
.d-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.d-tabs button .badge { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin-left: 5px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--warn-bg); color: var(--warn); }
.d-empty { color: var(--text-muted); font-size: 13.5px; text-align: center; padding-top: 10px; }
.lpager { display: flex; justify-content: center; gap: 7px; min-height: 9px; margin-top: 2px; }
.lpager button { all: unset; cursor: pointer; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.lpager button.on { background: var(--accent); }

/* mix rows */
.mrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 26px; align-items: center; gap: 8px; min-height: 34px; padding: 2px 8px; border-radius: 10px; background: var(--surface2); }
.mrow .em { font-size: 18px; text-align: center; }
.mrow .nm { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.qty { display: flex; align-items: center; gap: 3px; }
.qty button, .mrow .x { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: var(--surface); }
.qty button:hover, .mrow .x:hover { background: var(--card-hover); }
.qty .v { min-width: 48px; text-align: center; font-size: 12px; color: var(--text-dim); line-height: 1.15; }
.mrow .x { background: transparent; color: var(--text-muted); font-size: 13px; }

/* nutrition */
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.macro { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; background: var(--surface2); }
.macro b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.macro span { font-size: 11px; color: var(--text-muted); }
.macro.hi { background: var(--warn-bg); }
.bar-row > span:first-child { overflow-wrap: anywhere; line-height: 1.2; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px 36px; align-items: center; gap: 8px; min-height: 22px; font-size: 12.5px; }
.bar-row .v { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); text-align: right; white-space: nowrap; }
.bar-row .pct { font-size: 11.5px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.bar-row .pct.good { color: var(--good); }
.bar { height: 6px; border-radius: 3px; background: var(--surface3); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
.bar-row.cmp { grid-template-columns: minmax(0, 1fr) auto 90px; }
.sub-lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }

/* health */
.alert { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.35; }
.alert svg { width: 16px; height: 16px; margin-top: 1px; }
.alert b { display: block; font-size: 13px; }
.alert .src { color: var(--text-muted); font-size: 11.5px; }
.alert.good { background: var(--good-bg); } .alert.good svg { color: var(--good); }
.alert.warn { background: var(--warn-bg); } .alert.warn svg { color: var(--warn); }
.alert.danger { background: var(--danger-bg); } .alert.danger svg { color: var(--danger); }
.benefits { display: flex; flex-wrap: wrap; gap: 5px; }
.benefit { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); }
.d-foot { font-size: 11.5px; color: var(--text-muted); text-align: center; }

/* taste: verdict line + radar of 8 sensory axes */
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.t-sum { font-family: 'Instrument Serif', serif; font-size: 21px; color: var(--accent); line-height: 1.1; }
.t-info { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; color: var(--text-dim); background: var(--surface2); }
.t-info:hover, .t-info[aria-expanded="true"] { background: var(--accent-soft); color: var(--text); }
.t-src { font-size: 11.5px; line-height: 1.45; color: var(--text-dim); background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.t-src[hidden] { display: none; }
.t-wrap { position: relative; flex: 1; min-height: 110px; display: grid; place-items: center; }
.t-radar { width: 100%; height: 100%; max-height: 260px; }
.t-radar .ring { fill: none; stroke: var(--border); }
.t-radar .spoke { stroke: var(--border); }
.t-radar .lab { fill: var(--text-dim); font-size: 11px; }
.t-radar .shape { fill: var(--accent); fill-opacity: .2; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.t-radar .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.t-radar .hit { fill: transparent; }
.t-tip { position: absolute; pointer-events: none; transform: translate(-50%, -130%); padding: 4px 9px; border-radius: 8px; font-size: 12px; white-space: nowrap;
  background: var(--float); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--border); box-shadow: var(--float-shadow); }
.t-tip[hidden] { display: none; }
#tasteView.on { height: 100%; }

/* ---------- right pane: ingredient picker ---------- */
.picker { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { all: unset; cursor: pointer; height: 30px; padding: 0 13px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 13px; color: var(--text-dim); background: var(--surface2); white-space: nowrap; transition: background-color .15s, color .15s; }
.pill:hover { color: var(--text); }
.pill.on { color: var(--text); background: var(--accent-soft); font-weight: 600; }
.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-auto-rows: 64px; gap: 8px; align-content: start; overflow: hidden; }
.tile { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 10px; padding: 0 10px 0 12px; border-radius: 12px; background: var(--surface2); transition: background-color .15s; }
.tile:hover { background: var(--card-hover); }
.tile.in { background: var(--accent-soft); }
.tile.off { display: none; }
.tile .em { font-size: 22px; text-align: center; }
.tile .nm { font-size: 14px; font-weight: 600; line-height: 1.2; }
.tile .meta { display: block; font-size: 11.5px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }
.tile .add { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--accent); background: var(--surface); }
.tile .add:hover { background: var(--accent); color: var(--on-accent); }
.tile .n { font-size: 11px; font-weight: 700; color: var(--accent); }
.pager { display: flex; justify-content: center; gap: 8px; min-height: 10px; }
.pager button { all: unset; cursor: pointer; width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.pager button.on { background: var(--accent); }
.p-empty { grid-column: 1 / -1; color: var(--text-muted); font-size: 13.5px; padding: 8px 2px; }

/* reserve the shared footer's final height so nothing jumps when its script arrives */
#scn-footer { flex: none; min-height: 56px; }

/* short laptop screens: a smaller glass */
@media (min-width: 900px) and (max-height: 760px) {
  .glass-container { width: 128px; height: 166px; }
  .drinkside { gap: 6px; }
  .mrow { min-height: 30px; }
  .macros { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .macro { padding: 5px 1px; } .macro b { font-size: 13px; }
}

/* ---------- narrow screens: drink pane on top in two columns, picker below ---------- */
@media (max-width: 899px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 0 10px; }
  .bar-in { padding: 0 12px; gap: 8px; }
  .search { display: none; }
  .search-open { display: grid !important; margin-left: auto; }
  .topbar.searching .search { display: flex; position: absolute; left: 10px; right: 10px; top: calc(11px + env(safe-area-inset-top)); max-width: none; z-index: 40; }
  .drinkside.card { display: grid; grid-template-columns: minmax(0, 1fr) var(--glasscol, 120px);
    grid-template-areas: "types types" "verdict glass" "views glass" "tabs tabs"; grid-template-rows: auto auto minmax(0, 1fr) auto;
    column-gap: 10px; row-gap: 6px; padding: 10px 12px 12px; align-items: start; }
  .types { grid-area: types; justify-self: start; }
  .verdict { grid-area: verdict; text-align: left; height: auto; }
  .glass-container { grid-area: glass; align-self: center; width: var(--glasscol, 120px); height: calc(var(--glasscol, 120px) * 1.3); }
  .d-views { grid-area: views; height: min(210px, 28vh); }
  .d-tabs { grid-area: tabs; justify-self: stretch; }
  .d-tabs button { flex: 1; text-align: center; padding: 6px 1px; font-size: 11.5px; }
  .t-sum { font-size: 18px; }
  .mrow { grid-template-columns: 20px minmax(0, 1fr) 22px; grid-template-areas: "em nm x" "em qty x"; gap: 1px 6px; padding: 4px 6px; }
  .mrow .em { grid-area: em; } .mrow .nm { grid-area: nm; } .mrow .qty { grid-area: qty; justify-self: start; } .mrow .x { grid-area: x; }
  .mrow .em { font-size: 15px; } .mrow .nm { font-size: 12.5px; }
  .qty button, .mrow .x { width: 22px; height: 22px; font-size: 13px; }
  .qty .v { min-width: 30px; } .qty .vs { display: none; }
  .d-tabs button .badge { min-width: 15px; height: 15px; margin-left: 3px; font-size: 9.5px; }
  .t-radar .lab { font-size: 15px; }

     if(totals.macros.sugar > 30) flags.push('High total sugar ('+Math.round(totals.macros.sugar)+'g) — monitor blood glucose');
     if(totals.macros.sugar > 20 && totals.macros.fiber < 3) flags.push('High sugar with low fiber = rapid glucose spike');
     return flags;
   },
   positives:(totals) => {
     const p = [];
     if(totals.compounds.cinnamaldehyde > 5) p.push('Cinnamon compounds may improve insulin sensitivity');
     if(totals.macros.fiber > 8) p.push('High fiber slows glucose absorption');
     if(totals.compounds.anthocyanins > 50) p.push('Anthocyanins may improve insulin signaling');
     return p;
   }},
  {condition:'Kidney Disease',
   check:(totals) => {
     const flags = [];
     if(totals.micros.potassium > 600) flags.push('Very high potassium ('+Math.round(totals.micros.potassium)+'mg) — dangerous with impaired kidneys');
     if(totals.macros.protein > 25) flags.push('High protein load may strain kidneys');
     if(totals.micros.phosphorus > 300) flags.push('High phosphorus — restrict with kidney disease');
     return flags;
   },
   positives:() => []
  },
];

// ====================== UI ======================

const DRINK_TYPES = ['Smoothie','Yogurt Bowl','Coffee','Juice','Shake'];
let currentCategory = 'All';
let currentDrinkType = 'Smoothie';
let mix = []; // {id, qty} where qty is number of servings
const ui = { page: 0, view: 'mix', lp: {} };
const $ = id => document.getElementById(id);
const ICON = {
  good: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',

};

function getIng(id) { return INGREDIENTS.find(i => i.id === id); }

function renderIngredients() {

  $('tiles').innerHTML = items.length ? items.map(i => {

      <span class="nm">${i.name}<span class="meta">${i.macros.cal} kcal · ${i.serving.split('(')[0].trim()}${m ? ` · <span class="n">×${m.qty}</span>` : ''}</span></span>
      <button class="add" data-add="${i.id}" aria-label="Add ${i.name}">+</button></div>`;

$('q').addEventListener('input', () => { ui.page = 0; renderIngredients(); });

/* split a grid's items into pages that fit its box; data-stretch grows rows to fill */
function fitPages(root, pager, key) {
  const items = [...root.children].filter(x => x.classList.contains('tile'));
  items.forEach(t => t.classList.remove('off'));
  pager.innerHTML = '';
  if (root.dataset.stretch) root.style.gridAutoRows = '';
  if (!items.length || !root.offsetParent) return;
  const cs = getComputedStyle(root), cols = cs.gridTemplateColumns.split(' ').length;
  const rowH = items[0].getBoundingClientRect().height, gap = parseFloat(cs.rowGap) || 0;
  const rows = Math.max(1, Math.floor((root.clientHeight + gap) / (rowH + gap)));
  const per = cols * rows, pages = Math.ceil(items.length / per);
  ui[key] = Math.min(ui[key], pages - 1);
  items.forEach((t, i) => t.classList.toggle('off', Math.floor(i / per) !== ui[key]));
  if (root.dataset.stretch) {
    const used = pages > 1 ? rows : Math.ceil(items.length / cols);
    root.style.gridAutoRows = Math.floor(Math.min(+root.dataset.stretch, (root.clientHeight - gap * (used - 1)) / used)) + 'px';
  }
  if (pages > 1) pager.innerHTML = Array.from({ length: pages }, (_, i) => `<button class="${i === ui[key] ? 'on' : ''}" data-page="${i}" aria-label="Page ${i + 1}"></button>`).join('');
}
const paginate = () => fitPages($('tiles'), $('pager'), 'page');
$('pager').onclick = e => { const b = e.target.closest('[data-page]'); if (b) { ui.page = +b.dataset.page; paginate(); } };
function turnPage(d) { const n = $('pager').children.length || 1, p = ui.page + d; if (p >= 0 && p < n) { ui.page = p; paginate(); } }
let wheelLock = 0;
$('tiles').addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaY) < 20 || Date.now() < wheelLock) return; wheelLock = Date.now() + 500; turnPage(e.deltaY > 0 ? 1 : -1); }, { passive: false });
new ResizeObserver(() => paginate()).observe($('tiles'));

// ---------- drink type ----------
function renderDrinkTypes() {
  $('types').innerHTML = DRINK_TYPES.map(d => `<button role="tab" class="${d === currentDrinkType ? 'on' : ''}" data-type="${d}">${d}</button>`).join('');
}
$('types').onclick = e => { const b = e.target.closest('[data-type]'); if (b) { currentDrinkType = b.dataset.type; renderDrinkTypes(); update(); } };

// ---------- mix management ----------
function addToMix(id) { const m = mix.find(x => x.id === id); if (m) m.qty += 1; else mix.push({ id, qty: 1 }); update(); }
function removeFromMix(id) { mix = mix.filter(m => m.id !== id); update(); }
function adjustQty(id, delta) { const m = mix.find(x => x.id === id); if (!m) return; m.qty = Math.max(0.25, Math.round((m.qty + delta) * 4) / 4); update(); }

// ---------- the drink pane ----------
function update() {
  renderGlass();
  renderVerdict();
  renderDrinkViews();
  renderIngredients();
}

function renderVerdict() {
  const v = $('verdict');
  if (!mix.length) { v.className = 'verdict idle'; v.innerHTML = `<span class="nm">Empty glass</span>`; return; }
  const a = analyze(), g = Math.round(mix.reduce((s, m) => s + getIng(m.id).g * m.qty, 0));
  v.className = 'verdict';
  v.innerHTML = `<span class="lbl">Your ${currentDrinkType.toLowerCase()}<button class="clear-btn" id="clearBtn" type="button" aria-label="Empty the glass" title="Empty the glass"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button></span><span class="nm">${Math.round(a.totals.macros.cal)} kcal · ${g} g</span>`;
}

function renderDrinkViews() {
  const empty = txt => `<div class="d-empty">${txt}</div>`;
  if (!mix.length) {
    $('mixList').innerHTML = empty('Add ingredients from the picker');
    ['nutriView', 'compView', 'healthView'].forEach(id => $(id).innerHTML = empty('Add ingredients to see the analysis'));
    renderTaste();
    $('dtabs').querySelector('[data-dv="health"]').innerHTML = 'Health';
    return fitDrinkView();
  }
  const a = analyze(), t = a.totals;
  // Mix
  $('mixList').innerHTML = mix.map(m => { const i = getIng(m.id);
    return `<div class="mrow"><span class="em">${i.emoji}</span><span class="nm">${i.name}</span>
      <span class="qty"><button data-q="${m.id}" data-d="-0.25" aria-label="Less ${i.name}">−</button><span class="v" title="${m.qty}× ${i.serving}">${m.qty}×<span class="vs"> ${i.serving.split('(')[0].trim()}</span></span><button data-q="${m.id}" data-d="0.25" aria-label="More ${i.name}">+</button></span>
      <button class="x" data-rm="${m.id}" aria-label="Remove ${i.name}">✕</button></div>`; }).join('');
  // Nutrition: six macro tiles, then micronutrients by % of daily value
  const mac = (v, u, n, hi) => `<div class="macro${hi ? ' hi' : ''}"><b>${v}<span class="mono" style="font-size:11px"> ${u}</span></b><span>${n}</span></div>`;
  const micros = Object.keys(t.micros).filter(k => t.micros[k] > 0.01)
    .sort((x, y) => t.micros[y] / (a.MICRO_RDA[y] || 1) - t.micros[x] / (a.MICRO_RDA[x] || 1));
  $('nutriView').innerHTML = `<div class="macros">${mac(Math.round(t.macros.cal), 'kcal', 'energy')}${mac(t.macros.protein.toFixed(1), 'g', 'protein')}${mac(t.macros.carb.toFixed(1), 'g', 'carbs')}
      ${mac(t.macros.fat.toFixed(1), 'g', 'fat')}${mac(t.macros.fiber.toFixed(1), 'g', 'fiber')}${mac(t.macros.sugar.toFixed(1), 'g', 'sugar', t.macros.sugar > 30)}</div>
    ${micros.length ? `<div class="sub-lbl">Micronutrients · % daily value</div><div class="plist">${micros.map(k => { const val = t.micros[k], pct = Math.min(100, val / (a.MICRO_RDA[k] || 1) * 100);
      return `<div class="bar-row"><span>${a.MICRO_NAMES[k] || k}</span><span class="v">${val < 1 ? val.toFixed(2) : val.toFixed(1)} ${a.MICRO_UNITS[k] || ''}</span><span class="bar"><i style="width:${pct}%;${pct > 80 ? 'background:var(--good)' : pct > 40 ? '' : 'background:var(--text-muted)'}"></i></span><span class="pct${pct > 80 ? ' good' : ''}">${Math.round(pct)}%</span></div>`; }).join('')}</div>` : ''}`;
  // Compounds: strongest first, bar relative to the largest
  const comps = Object.keys(t.compounds).filter(k => t.compounds[k] > 0.01).sort((x, y) => t.compounds[y] - t.compounds[x]).slice(0, 16);
  const max = Math.max(1e-9, ...comps.map(k => t.compounds[k]));
  const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' g' : v >= 1 ? v.toFixed(1) + ' mg' : (v * 1000).toFixed(0) + ' µg';
  $('compView').innerHTML = comps.length ? `<div class="plist">${comps.map(k => `<div class="bar-row cmp"><span>${a.COMPOUND_NAMES[k] || k}</span><span class="v">${fmt(t.compounds[k])}</span><span class="bar"><i style="width:${t.compounds[k] / max * 100}%"></i></span></div>`).join('')}</div>`
    : empty('No notable compounds');
  // Health: cautions first, then synergies and condition notes; benefits as chips
  const cards = [];
  a.allWarnings.forEach(w => cards.push([w.type === 'danger' ? 'danger' : 'warn', w.cond, w.note, `from ${w.source}`]));
  a.activeInteractions.filter(x => x.type !== 'good').forEach(x => cards.push(['warn', x.title, x.msg]));
  a.diseaseAlerts.forEach(d => d.flags.forEach(f => cards.push(['warn', d.condition, f])));
  a.activeInteractions.filter(x => x.type === 'good').forEach(x => cards.push(['good', x.title, x.msg]));
  a.diseaseAlerts.forEach(d => d.positives.forEach(p => cards.push(['good', d.condition, p])));
  const cautions = cards.filter(c => c[0] !== 'good').length;
  $('healthView').innerHTML = `<div class="plist">${cards.map(([k, ti, msg, src]) => `<div class="alert ${k}">${ICON[k]}<div><b>${ti}</b>${msg}${src ? `<div class="src">${src}</div>` : ''}</div></div>`).join('')
      || '<div class="alert good">' + ICON.good + '<div><b>No cautions</b>Nothing flagged for this mix</div></div>'}</div>
    ${a.allBenefits.size ? `<div class="benefits">${[...a.allBenefits].map(b => `<span class="benefit">${b}</span>`).join('')}</div>` : ''}
    <div class="d-foot">Estimates · not medical advice</div>`;
  $('dtabs').querySelector('[data-dv="health"]').innerHTML = `Health${cautions ? `<span class="badge">${cautions}</span>` : ''}`;
  renderTaste();
  fitDrinkView();
}
$('mixList').onclick = e => {
  const q = e.target.closest('[data-q]'); if (q) return adjustQty(q.dataset.q, +q.dataset.d);
  const r = e.target.closest('[data-rm]'); if (r) removeFromMix(r.dataset.rm);
};

/* page the current tab's list instead of letting it overflow (rule 36) */
function fitDrinkView() {
  const box = $('dviews'), dv = box.querySelector('.dv.on');
  if (!dv || !box.offsetParent) return;
  dv.querySelectorAll('.off').forEach(x => x.classList.remove('off'));
  dv.querySelectorAll('.lpager').forEach(x => x.remove());
  const over = () => dv.offsetHeight - box.clientHeight;
  if (over() <= 1) return;
  const benefits = dv.querySelector('.benefits');                 // health: drop the chips before paging cards
  if (benefits) { benefits.classList.add('off'); if (over() <= 1) return; }
  const list = dv.querySelector('.plist'); if (!list) return;
  const items = [...list.children]; if (items.length < 2) return;
  const pager = document.createElement('div'); pager.className = 'lpager'; pager.innerHTML = '<button></button>'; list.after(pager);
  const top = items[0].getBoundingClientRect().top, span = items.at(-1).getBoundingClientRect().bottom - top;
  const avail = Math.max(items[0].offsetHeight, span - over());
  const pages = []; let start = 0;
  items.forEach((it, i) => { if (it.getBoundingClientRect().bottom - items[start].getBoundingClientRect().top > avail && i > start) { pages.push([start, i]); start = i; } });
  pages.push([start, items.length]);
  const key = dv.dataset.dv; ui.lp[key] = Math.min(ui.lp[key] || 0, pages.length - 1);
  const [a, b] = pages[ui.lp[key]];
  items.forEach((it, i) => it.classList.toggle('off', i < a || i >= b));
  pager.innerHTML = pages.map((_, i) => `<button class="${i === ui.lp[key] ? 'on' : ''}" data-lp="${i}" aria-label="Page ${i + 1}"></button>`).join('');
  pager.onclick = e => { const x = e.target.closest('[data-lp]'); if (x) { ui.lp[key] = +x.dataset.lp; fitDrinkView(); } };
}
new ResizeObserver(() => fitDrinkView()).observe($('dviews'));

function setDrinkView(v) {
  ui.view = v;
  $('dtabs').querySelectorAll('[data-dv]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.dv === v)));
  $('dviews').querySelectorAll('.dv').forEach(el => el.classList.toggle('on', el.dataset.dv === v));
  fitDrinkView();
}
$('dtabs').onclick = e => { const b = e.target.closest('[data-dv]'); if (b) setDrinkView(b.dataset.dv); };
$('verdict').onclick = e => { if (e.target.closest('#clearBtn')) { mix = []; ui.lp = {}; update(); } };

// narrow screens: the glass takes ~34% of the card's width
const narrowMQ = matchMedia('(max-width: 899px)');
new ResizeObserver(() => {
  const ds = $('drinkside');
  if (!narrowMQ.matches) return ds.style.removeProperty('--glasscol');
  ds.style.setProperty('--glasscol', Math.round(Math.max(96, Math.min(170, ds.clientWidth * .34))) + 'px');
}).observe($('drinkside'));

// search: on phones the field opens over the app bar
$('searchOpen').onclick = () => { document.querySelector('.topbar').classList.add('searching'); $('q').focus(); };
$('q').addEventListener('blur', () => { if (!$('q').value) document.querySelector('.topbar').classList.remove('searching'); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); document.querySelector('.topbar').classList.add('searching'); $('q').focus(); return; }
  if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; $('q').blur(); document.querySelector('.topbar').classList.remove('searching'); ui.page = 0; return renderIngredients(); }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); turnPage(1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); turnPage(-1); }
});

// ====================== GLASS VISUALIZATION ======================
/* Containers drawn per drink type: clear glasses (tumbler, highball, soda-fountain, glass mug) and a ceramic bowl.
   Each has wall thickness, a 3D rim, a curved liquid surface, cylinder shading, a thick base and a soft shadow. */
const CONTAINERS = {
  'Smoothie':    { kind: 'glass', top: 34, bot: 232, cap: 500, straw: true,  half: y => 62 - 12 * (y - 34) / 198 },
  'Juice':       { kind: 'glass', top: 30, bot: 232, cap: 400, straw: false, half: y => 46 - 3 * (y - 30) / 202 },
  'Shake':       { kind: 'glass', top: 30, bot: 186, cap: 500, straw: true,  stem: true, half: y => 15 + 49 * Math.pow(1 - (y - 30) / 156, 1.5) },
  'Coffee':      { kind: 'glass', top: 70, bot: 232, cap: 350, straw: false, handle: true, half: () => 52 },
  'Yogurt Bowl': { kind: 'bowl',  top: 128, bot: 226, cap: 400, half: y => 84 - 56 * Math.pow((y - 128) / 98, 2) },
};
function renderGlass() {
  const C = CONTAINERS[currentDrinkType] || CONTAINERS.Smoothie, cx = 100, wall = 4, ry = h => h * 0.16;
  const items = mix.map(m => ({ ing: getIng(m.id), q: m.qty })), totalG = items.reduce((s, x) => s + x.ing.g * x.q, 0);
  let col = { r: 0, g: 0, b: 0 };
  items.forEach(x => { const c = hexToRgb(x.ing.color), w = x.ing.g * x.q / (totalG || 1); col.r += c.r * w; col.g += c.g * w; col.b += c.b * w; });
  const rgb = (k, a = 1) => `rgba(${Math.min(255, Math.round(col.r * k))},${Math.min(255, Math.round(col.g * k))},${Math.min(255, Math.round(col.b * k))},${a})`;
  const fill = totalG ? Math.max(.08, Math.min(.92, totalG / C.cap)) : 0;
  const innerTop = C.top + 6, innerBot = C.bot - (C.kind === 'bowl' ? 6 : 12);
  const yFill = innerBot - fill * (innerBot - innerTop);
  // outline helpers: sample the profile down each side
  const side = (h, inset, y0, y1, sgn) => { const pts = []; for (let i = 0; i <= 24; i++) { const y = y0 + (y1 - y0) * i / 24; pts.push([cx + sgn * (C.half(y) - inset), y]); } return pts; };
  const pathFor = (inset, y0, y1) => {
    const L = side(0, inset, y0, y1, -1), R = side(0, inset, y0, y1, 1).reverse(), hb = C.half(y1) - inset;
    return `M${L.map(p => p.map(n => n.toFixed(1)).join(',')).join(' L')} Q${cx - hb},${(y1 + ry(hb)).toFixed(1)} ${cx},${(y1 + ry(hb)).toFixed(1)} Q${cx + hb},${(y1 + ry(hb)).toFixed(1)} ${R.map(p => p.map(n => n.toFixed(1)).join(',')).join(' L')} Z`;
  };
  const hTop = C.half(C.top), hF = C.half(yFill) - wall;
  let s = `<defs>
    <linearGradient id="gWall" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".05"/><stop offset=".8" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gLiq" x1="0" x2="1"><stop offset="0" stop-color="${rgb(.62)}"/><stop offset=".32" stop-color="${rgb(1.08)}"/><stop offset=".7" stop-color="${rgb(.95)}"/><stop offset="1" stop-color="${rgb(.58)}"/></linearGradient>
    <linearGradient id="gLiqV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
    <linearGradient id="gCer" x1="0" x2="1"><stop offset="0" stop-color="var(--bowl-a)"/><stop offset=".4" stop-color="var(--bowl-b)"/><stop offset="1" stop-color="var(--bowl-c)"/></linearGradient>
    <clipPath id="cIn"><path d="${pathFor(wall, innerTop - 40, innerBot)}"/></clipPath>
  </defs>`;
  // shadow
  s += `<ellipse cx="${cx}" cy="${C.stem ? 236 : C.bot + 8}" rx="${(C.stem ? 40 : C.half(C.bot) + 10).toFixed(1)}" ry="6" fill="#000" opacity=".16"/>`;
  if (C.kind === 'bowl') {
    // ceramic bowl: outer body, foot ring, liquid (yogurt) surface with toppings, rim
    s += `<path d="${pathFor(0, C.top, C.bot)}" fill="url(#gCer)" stroke="var(--glass-stroke)" stroke-width="1"/>`;
    s += `<ellipse cx="${cx}" cy="${C.bot + 2}" rx="30" ry="5" fill="var(--bowl-c)" stroke="var(--glass-stroke)" stroke-width=".8"/>`;
    s += `<ellipse cx="${cx}" cy="${C.top}" rx="${hTop}" ry="${ry(hTop)}" fill="var(--bowl-in)" stroke="var(--glass-stroke)" stroke-width="1"/>`;
    if (totalG) {
      const yS = C.top + (1 - fill) * 30, hs = C.half(yS) - 7;
      s += `<ellipse cx="${cx}" cy="${yS.toFixed(1)}" rx="${hs.toFixed(1)}" ry="${ry(hs).toFixed(1)}" fill="${rgb(1.05)}"/>`;
      s += `<ellipse cx="${cx - hs * .25}" cy="${(yS - ry(hs) * .3).toFixed(1)}" rx="${(hs * .5).toFixed(1)}" ry="${(ry(hs) * .45).toFixed(1)}" fill="#fff" opacity=".18"/>`;
      // toppings: a few pieces in each ingredient's colour, placed deterministically on the surface
      let k = 0; items.forEach(x => { for (let j = 0; j < Math.min(6, Math.ceil(x.q * 3)); j++, k++) {
        const a = k * 2.399, rr = Math.sqrt((k % 13 + .5) / 13) * .82;
        s += `<circle cx="${(cx + Math.cos(a) * hs * rr).toFixed(1)}" cy="${(yS + Math.sin(a) * ry(hs) * rr).toFixed(1)}" r="${(2.2 + (k % 3)).toFixed(1)}" fill="${x.ing.color}" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>`; } });
    }
    s += `<path d="M${cx - hTop},${C.top} A${hTop},${ry(hTop)} 0 0 0 ${cx + hTop},${C.top}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>`;
  } else {
    // clear glass: back wall, liquid, front wall, rim, base, highlights
    if (C.stem) s += `<path d="M${cx - 6},${C.bot} L${cx - 4},226 L${cx + 4},226 L${cx + 6},${C.bot} Z" fill="var(--glass-fill)" stroke="var(--glass-stroke)" stroke-width="1"/><ellipse cx="${cx}" cy="229" rx="34" ry="6" fill="var(--glass-fill)" stroke="var(--glass-stroke)" stroke-width="1"/>`;
    if (C.handle) s += `<path d="M${cx + 52},${C.top + 34} C${cx + 86},${C.top + 34} ${cx + 86},${C.bot - 42} ${cx + 52},${C.bot - 42}" fill="none" stroke="var(--glass-stroke)" stroke-width="9" stroke-linecap="round" opacity=".55"/><path d="M${cx + 52},${C.top + 34} C${cx + 86},${C.top + 34} ${cx + 86},${C.bot - 42} ${cx + 52},${C.bot - 42}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>`;
    s += `<path d="${pathFor(0, C.top, C.bot)}" fill="var(--glass-fill)"/>`;
    if (totalG) {
      s += `<g clip-path="url(#cIn)"><rect x="0" y="${yFill.toFixed(1)}" width="200" height="260" fill="url(#gLiq)"/><rect x="0" y="${yFill.toFixed(1)}" width="200" height="260" fill="url(#gLiqV)"/>`;
      let k = 0; items.forEach(x => { for (let j = 0; j < Math.min(5, Math.ceil(x.q * 2)); j++, k++) {   // suspended bits (seeds, fruit)
        const px = cx + (((k * 37) % 100) / 100 - .5) * 2 * (hF - 6), py = yFill + 10 + ((k * 53) % 100) / 100 * Math.max(4, innerBot - yFill - 16);
        s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(1.4 + (k % 3) * .7).toFixed(1)}" fill="${x.ing.color}" opacity=".55"/>`; } });
      s += `</g><ellipse cx="${cx}" cy="${yFill.toFixed(1)}" rx="${hF.toFixed(1)}" ry="${ry(hF).toFixed(1)}" fill="${rgb(1.18)}"/><ellipse cx="${(cx - hF * .2).toFixed(1)}" cy="${(yFill - ry(hF) * .2).toFixed(1)}" rx="${(hF * .55).toFixed(1)}" ry="${(ry(hF) * .4).toFixed(1)}" fill="#fff" opacity=".22"/>`;
    }
    if (C.straw) { const sx = cx + hTop * .28;
      s += `<g clip-path="url(#cIn)"><line x1="${sx + 22}" y1="${C.top - 26}" x2="${sx - 6}" y2="${innerBot - 6}" stroke="var(--straw)" stroke-width="7" stroke-linecap="round" opacity=".45"/></g>`;
      s += `<line x1="${sx + 22}" y1="${C.top - 30}" x2="${sx + 13}" y2="${C.top + 2}" stroke="var(--straw)" stroke-width="7" stroke-linecap="round"/>`; }
    s += `<path d="${pathFor(0, C.top, C.bot)}" fill="url(#gWall)" stroke="var(--glass-stroke)" stroke-width="1.4"/>`;
    s += `<path d="M${cx - C.half(C.bot) + wall},${C.bot - 10} Q${cx},${C.bot - 4} ${cx + C.half(C.bot) - wall},${C.bot - 10}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;   // thick base
    s += `<path d="M${cx - hTop + 9},${C.top + 14} L${cx - C.half(C.bot - 30) + 9},${C.bot - 30}" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>`;   // highlight streak
    s += `<ellipse cx="${cx}" cy="${C.top}" rx="${hTop}" ry="${ry(hTop).toFixed(1)}" fill="none" stroke="var(--glass-stroke)" stroke-width="1.4"/><path d="M${cx - hTop},${C.top} A${hTop},${ry(hTop).toFixed(1)} 0 0 0 ${cx + hTop},${C.top}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/>`;
  }
  if (totalG) s += `<text class="glass-label" x="${cx}" y="252" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">${Math.round(totalG)} g · ${Math.round(fill * 100)}% full</text>`;
  $('glassContainer').innerHTML = `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${currentDrinkType} container${totalG ? `, ${Math.round(fill * 100)}% full` : ', empty'}">${s}</svg>`;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

// ====================== TASTE ======================
// Eight sensory dimensions: the five basic tastes (Chandrashekar et al. 2006, Nature 444:288) plus three standard
// mouthfeel / chemesthesis attributes used by beverage sensory panels. Scores (0–5) are estimates of what one serving
// adds to a ~300 g drink.
const TASTE_AXES = [
  ['sweet', 'Sweet'], ['sour', 'Sour'], ['salty', 'Salty'], ['bitter', 'Bitter'],
  ['umami', 'Umami'], ['pungent', 'Pungent'], ['astringent', 'Astringent'], ['body', 'Body'],
];
//                  sweet sour salty bitter umami pungent astringent body
const TASTE = {
  avocado:       [0.5, 0,   0,   0.3, 0.3, 0,   0,   3.5],
  blueberry:     [2,   1.5, 0,   0.3, 0,   0,   1,   0.8],
  banana:        [3,   0.2, 0,   0,   0,   0,   0.3, 2.5],
  mango:         [2.5, 0.6, 0,   0,   0,   0,   0,   1.5],
  strawberry:    [2,   1.8, 0,   0,   0,   0,   0.6, 0.8],
  pineapple:     [2,   2.2, 0,   0,   0,   0,   0.3, 0.5],
  almond_milk:   [0.3, 0,   0.4, 0.2, 0,   0,   0,   1],
  oat_milk:      [1.5, 0,   0.3, 0,   0,   0,   0,   1.8],
  greek_yogurt:  [0.5, 2.5, 0.3, 0,   0.5, 0,   0.3, 3.5],
  coconut_milk:  [1,   0,   0.2, 0,   0,   0,   0,   3],
  turmeric:      [0,   0,   0,   1.5, 0,   0.8, 0.8, 0],
  black_pepper:  [0,   0,   0,   0.3, 0,   2,   0,   0],
  ginger:        [0.2, 0,   0,   0.3, 0,   2.5, 0,   0],
  cinnamon:      [0.8, 0,   0,   0.3, 0,   1,   0.6, 0],
  matcha:        [0,   0,   0,   2.5, 1.2, 0,   2.5, 0.2],
  spirulina:     [0,   0,   0.4, 1.5, 2,   0,   0.3, 0.2],
  honey:         [3,   0.3, 0,   0,   0,   0,   0,   0.5],
  maple_syrup:   [3,   0,   0,   0,   0,   0,   0,   0.3],
  chia:          [0,   0,   0,   0,   0,   0,   0,   2.5],
  flaxseed:      [0,   0,   0,   0.5, 0,   0,   0,   1],
  peanut_butter: [0.8, 0,   1.2, 0.3, 1,   0,   0.3, 2.5],
  whey_protein:  [1.5, 0,   0.3, 0.3, 0.5, 0,   0.5, 1.5],
  collagen:      [0,   0,   0,   0,   0.5, 0,   0,   0.3],
  espresso:      [0.2, 1.2, 0,   3.5, 0.3, 0,   1.2, 0.8],
  green_tea:     [0,   0,   0,   1.5, 0.8, 0,   1.8, 0],
  coconut_water: [1.2, 0.2, 0.6, 0,   0,   0,   0,   0],
};
const CREAMY = ['avocado', 'almond_milk', 'oat_milk', 'greek_yogurt', 'coconut_milk', 'peanut_butter', 'whey_protein'];
function tasteProfile() {
  if (!mix.length) return null;
  const v = TASTE_AXES.map(() => 0);
  let grams = 0, creamyG = 0;
  mix.forEach(m => { const s = TASTE[m.id], g = getIng(m.id).g * m.qty; grams += g;
    if (CREAMY.includes(m.id)) creamyG += g;
    if (s) s.forEach((x, i) => v[i] += x * m.qty); });
  const dilute = Math.min(1.5, 300 / Math.max(200, grams));       // a bigger glass tastes milder
  for (let i = 0; i < v.length; i++) v[i] *= dilute;
  const [SW, SO, SA, BI, , PU, AS] = [0, 1, 2, 3, 4, 5, 6], c = grams ? creamyG / grams : 0;
  const sweet = Math.min(5, v[SW]), salty = Math.min(5, v[SA]);
  v[BI] *= (1 - 0.08 * sweet) * (1 - 0.1 * salty);   // sweetness and salt mask bitterness (Keast & Breslin 2003; Breslin & Beauchamp 1997)
  v[SO] *= 1 - 0.06 * sweet;                          // sweetness masks sourness (Keast & Breslin 2003)
  v[AS] *= 1 - 0.4 * c;                               // milk proteins and fat bind polyphenols (Lesschaeve & Noble 2005)
  v[PU] *= 1 - 0.3 * c;                               // dairy and fat soften the burn (Nasrawi & Pangborn 1990)
  return v.map(x => Math.round(Math.min(5, Math.max(0, x)) * 10) / 10);
}
function renderTaste() {
  const el = $('tasteView'), v = tasteProfile();
  if (!v) { el.innerHTML = '<div class="d-empty">Add ingredients to see the taste profile</div>'; return; }
  const words = { sweet: 'sweet', sour: 'tangy', salty: 'salty', bitter: 'bitter', umami: 'savoury', pungent: 'spicy', astringent: 'dry', body: 'full-bodied' };
  const top = TASTE_AXES.map(([k], i) => [words[k], v[i]]).filter(x => x[1] >= 1).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]);
  const sum = top.length ? top.join(' & ').replace(/^./, c => c.toUpperCase()) : 'Light & mild';
  const N = TASTE_AXES.length, cx = 170, cy = 118, R = 78;
  const pt = (i, val) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * R * val / 5, cy + Math.sin(a) * R * val / 5]; };
  const poly = vals => vals.map((x, i) => pt(i, x).map(n => n.toFixed(1)).join(',')).join(' ');
  let s = '';
  for (let k = 1; k <= 5; k++) s += `<polygon class="ring" points="${poly(Array(N).fill(k))}"/>`;
  TASTE_AXES.forEach(([, name], i) => { const [x, y] = pt(i, 5), [lx, ly] = pt(i, 6.1);
    s += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="lab" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${Math.abs(lx - cx) < 4 ? 'middle' : lx > cx ? 'start' : 'end'}">${name}</text>`; });
  s += `<polygon class="shape" points="${poly(v)}"/>`;
  v.forEach((x, i) => { const [px, py] = pt(i, x); s += `<circle class="pt" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3"/><circle class="hit" data-a="${i}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="11"><title>${TASTE_AXES[i][1]} ${x.toFixed(1)} / 5</title></circle>`; });
  const open = ui.tasteSrc ? '' : ' hidden';
  el.innerHTML = `<div class="t-head"><div class="t-sum">${sum}</div><button class="t-info" id="tInfo" aria-expanded="${!!ui.tasteSrc}" aria-label="How the taste profile is worked out">i</button></div>
    <div class="t-src"${open}>Five basic tastes (Chandrashekar et al. 2006) plus pungency, astringency and body, scored 0–5 per serving (estimates) and diluted by the drink's weight. Sweetness and salt mask bitterness (Keast &amp; Breslin 2003; Breslin &amp; Beauchamp 1997); milk and fat soften astringency (Lesschaeve &amp; Noble 2005) and spice burn (Nasrawi &amp; Pangborn 1990).</div>
    <div class="t-wrap"><svg class="t-radar" id="tRadar" viewBox="0 0 340 236" role="img" aria-label="Taste profile: ${TASTE_AXES.map(([, n], i) => `${n} ${v[i]}`).join(', ')}">${s}</svg><div class="t-tip" id="tTip" hidden></div></div>`;
  $('tInfo').onclick = () => { ui.tasteSrc = !ui.tasteSrc; renderTaste(); fitDrinkView(); };
  const radar = $('tRadar'), tip = $('tTip');
  const show = e => { const h = e.target.closest('.hit'); if (!h) return tip.hidden = true;
    const w = radar.parentNode.getBoundingClientRect(), i = +h.dataset.a;
    tip.textContent = `${TASTE_AXES[i][1]} ${v[i].toFixed(1)} / 5`; tip.style.left = (e.clientX - w.left) + 'px'; tip.style.top = (e.clientY - w.top) + 'px'; tip.hidden = false; };
  radar.addEventListener('mousemove', show); radar.addEventListener('click', show);
  radar.addEventListener('mouseleave', () => tip.hidden = true);
}

// ====================== ANALYSIS (totals, interactions, condition checks) ======================
function analyze() {
  // Compute totals
  const totals = { macros:{cal:0,protein:0,fat:0,carb:0,fiber:0,sugar:0}, micros:{}, compounds:{} };
  const allBenefits = new Set();
  const allWarnings = [];

  mix.forEach(m => {
    const ing = getIng(m.id);
    const q = m.qty;
    // Macros
    Object.keys(ing.macros).forEach(k => totals.macros[k] += ing.macros[k] * q);
    // Micros
    Object.keys(ing.micros).forEach(k => {
      totals.micros[k] = (totals.micros[k]||0) + ing.micros[k] * q;
    });
    // Compounds
    Object.keys(ing.compounds).forEach(k => {
      totals.compounds[k] = (totals.compounds[k]||0) + ing.compounds[k] * q;
    });
    // Benefits
    ing.benefits.forEach(b => allBenefits.add(b));
    // Warnings
    ing.warnings.forEach(w => allWarnings.push({...w, source: ing.name}));
  });

  // Check interactions
  const activeInteractions = [];
  const compoundKeys = Object.keys(totals.compounds).filter(k => totals.compounds[k] > 0);
  INTERACTIONS.forEach(inter => {
    if(inter.check) {
      const enriched = mix.map(m => ({...getIng(m.id), qty: m.qty}));
      if(inter.check(enriched)) activeInteractions.push(inter);
    } else {
      const allPresent = inter.compounds.every(c => compoundKeys.includes(c));
      if(allPresent) activeInteractions.push(inter);
    }
  });

  // Disease checks
  const diseaseAlerts = [];
  DISEASE_CHECKS.forEach(dc => {
    const flags = dc.check(totals);
    const positives = dc.positives(totals);
    if(flags.length || positives.length) {
      diseaseAlerts.push({condition: dc.condition, flags, positives});
    }
  });

  // Compound display names
  const COMPOUND_NAMES = {
    curcumin:'Curcumin', piperine:'Piperine', caffeine:'Caffeine', lTheanine:'L-Theanine',
    egcg:'EGCG', anthocyanins:'Anthocyanins', pterostilbene:'Pterostilbene', quercetin:'Quercetin',
    chlorogenicAcid:'Chlorogenic Acid', gingerol:'Gingerol', cinnamaldehyde:'Cinnamaldehyde',
    bromelain:'Bromelain', phycocyanin:'Phycocyanin', betaGlucan:'Beta-Glucan',
    lauricAcid:'Lauric Acid', oleicAcid:'Oleic Acid', betaSitosterol:'Beta-Sitosterol',
    lutein:'Lutein', glutathione:'Glutathione', dopamine:'Dopamine', serotonin:'Serotonin',
    tryptophan:'Tryptophan', resistantStarch:'Resistant Starch', mangiferin:'Mangiferin',
    betaCarotene:'Beta-Carotene', ellagicAcid:'Ellagic Acid', pelargonidin:'Pelargonidin',
    fisetin:'Fisetin', coumarin:'Coumarin', eugenol:'Eugenol', proanthocyanidins:'Proanthocyanidins',
    chlorophyll:'Chlorophyll', catechins:'Catechins', ala:'ALA (Omega-3)', lignans:'Lignans',
    betaCaryophyllene:'Beta-Caryophyllene', avenanthramides:'Avenanthramides',
    lactoferrin:'Lactoferrin', bcaa:'BCAAs', leucine:'Leucine', hydroxyproline:'Hydroxyproline',
    glycine:'Glycine', proline:'Proline', shogaol:'Shogaol', zingerone:'Zingerone',
    ferulic:'Ferulic Acid', mct:'MCTs', capricAcid:'Capric Acid', resveratrol:'Resveratrol',
    pCoumaricAcid:'p-Coumaric Acid', coq10:'CoQ10', gla:'GLA', trigonelline:'Trigonelline',
    kahweol:'Kahweol', chrysin:'Chrysin', pinocembrin:'Pinocembrin',
    methylglyoxal:'Methylglyoxal', zeaxanthin:'Zeaxanthin', gallicAcid:'Gallic Acid',
    turmerone:'Turmerone', demethoxycurcumin:'Demethoxycurcumin', alphaTocopherol:'Alpha-Tocopherol',
    immunoglobulins:'Immunoglobulins', sdi:'SDI', probiotics:'Probiotics',
    casein:'Casein', wheyProtein:'Whey Protein', cla:'CLA', cytokinins:'Cytokinins',
    kaempferol:'Kaempferol', quebecol:'Quebecol', inulin:'Inulin',
    hydrogenPeroxide:'Hydrogen Peroxide', auxins:'Auxins', zingiberene:'Zingiberene',
  };

  // Micro display
  const MICRO_NAMES = {
    vitC:'Vitamin C', vitK:'Vitamin K', vitE:'Vitamin E', vitA:'Vitamin A', vitD:'Vitamin D',
    vitB6:'Vitamin B6', vitB12:'Vitamin B12', vitB3:'Niacin (B3)',
    folate:'Folate', calcium:'Calcium', iron:'Iron', potassium:'Potassium',
    magnesium:'Magnesium', manganese:'Manganese', zinc:'Zinc', copper:'Copper',
    phosphorus:'Phosphorus', sodium:'Sodium', thiamin:'Thiamin',
  };
  const MICRO_UNITS = {
    vitC:'mg', vitK:'µg', vitE:'mg', vitA:'µg', vitD:'µg', vitB6:'mg', vitB12:'µg', vitB3:'mg',
    folate:'µg', calcium:'mg', iron:'mg', potassium:'mg', magnesium:'mg', manganese:'mg',
    zinc:'mg', copper:'mg', phosphorus:'mg', sodium:'mg', thiamin:'mg',
  };
  // RDA for % bar
  const MICRO_RDA = {
    vitC:90, vitK:120, vitE:15, vitA:900, vitD:20, vitB6:1.7, vitB12:2.4, vitB3:16,
    folate:400, calcium:1000, iron:18, potassium:2600, magnesium:420, manganese:2.3,
    zinc:11, copper:0.9, phosphorus:700, sodium:2300, thiamin:1.2,
  };
  return { totals, allBenefits, allWarnings, activeInteractions, diseaseAlerts, COMPOUND_NAMES, MICRO_NAMES, MICRO_UNITS, MICRO_RDA };
}
